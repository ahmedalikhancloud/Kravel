apiVersion: v1
kind: Namespace
metadata:
  name: kravel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kravel
  namespace: kravel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kravel-killercoda-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kravel-killercoda-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kravel-killercoda-observer
subjects:
  - kind: ServiceAccount
    name: kravel
    namespace: kravel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kravel
  namespace: kravel-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kravel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kravel
    spec:
      serviceAccountName: kravel
      # bootstrap.sh imports the locally built image into the control-plane
      # node's containerd store. Keep this Pod on that same node.
      nodeSelector:
        kubernetes.io/hostname: controlplane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kravel
          image: kravel:killercoda
          imagePullPolicy: Never
          args: ["node", "src/main.mjs", "serve-watch"]
          env:
            - name: KRAVEL_HOST
              value: 0.0.0.0
            - name: KRAVEL_PORT
              value: "8080"
            - name: KRAVEL_DB_PATH
              value: /data/kravel.db
            - name: KRAVEL_CLUSTER_ID
              value: killercoda
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kravel
  namespace: kravel-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kravel
  ports:
    - name: http
      port: 8080
      targetPort: http
