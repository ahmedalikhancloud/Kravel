apiVersion: v1
kind: Namespace
metadata:
  name: kravel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kravel
  namespace: kravel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kravel-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "endpoints", "serviceaccounts", "persistentvolumeclaims", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kravel-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kravel-observer
subjects:
  - kind: ServiceAccount
    name: kravel
    namespace: kravel-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kravel-data
  namespace: kravel-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kravel
  namespace: kravel-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kravel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kravel
    spec:
      serviceAccountName: kravel
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kravel
          image: ghcr.io/YOUR_ORG/kravel:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["node", "src/main.mjs", "serve-watch"]
          env:
            - name: KRAVEL_HOST
              value: 0.0.0.0
            - name: KRAVEL_PORT
              value: "8080"
            - name: KRAVEL_DB_PATH
              value: /data/kravel.db
            - name: KRAVEL_CLUSTER_ID
              value: replace-with-a-stable-cluster-id
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kravel-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kravel
  namespace: kravel-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kravel
  ports:
    - name: http
      port: 8080
      targetPort: http
