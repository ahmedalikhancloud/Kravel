apiVersion: v1
kind: Namespace
metadata:
  name: kravel-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kravel
  namespace: kravel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kravel-local-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "endpoints", "serviceaccounts", "persistentvolumeclaims", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kravel-local-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kravel-local-observer
subjects:
  - kind: ServiceAccount
    name: kravel
    namespace: kravel-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kravel
  namespace: kravel-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kravel
  template:
    metadata:
      labels:
        app: kravel
    spec:
      serviceAccountName: kravel
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kravel
          image: kravel:local
          imagePullPolicy: Never
          args: ["node", "src/main.mjs", "serve-watch"]
          env:
            - name: KRAVEL_HOST
              value: 0.0.0.0
            - name: KRAVEL_PORT
              value: "8080"
            - name: KRAVEL_DB_PATH
              value: /data/kravel.db
            - name: KRAVEL_CLUSTER_ID
              value: docker-desktop
            - name: KRAVEL_LAYA_URL
              value: http://kravel-laya.kravel-ai.svc.cluster.local:8000
            - name: KRAVEL_LAYA_MODEL
              value: english
            - name: KRAVEL_LLM_BASE_URL
              value: http://model-runner.docker.internal/engines/v1
            - name: KRAVEL_LLM_MODEL
              value: ai/qwen3:4b-thinking-2507-q4_K_M
            - name: KRAVEL_LLM_MAX_TURNS
              value: "6"
            - name: KRAVEL_MLFLOW_URL
              value: http://kravel-mlflow.kravel-observability.svc.cluster.local:5000
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kravel
  namespace: kravel-system
spec:
  type: ClusterIP
  selector:
    app: kravel
  ports:
    - name: http
      port: 8080
      targetPort: http
