[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kravel"
version = "0.3.0"
description = "LangGraph Kubernetes operator with independent human-approved execution"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "langgraph==1.2.12",
  "mlflow-tracing==3.16.0",
  "openai==3.22.1",
  "nemoguardrails==0.24.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
evaluation = ["mlflow==3.16.0"]
retrieval = ["sentence-transformers==5.7.0"]

[project.scripts]
kravel = "kravel.cli:main"

[tool.setuptools.packages.find]
include = ["kravel*"]

[tool.setuptools.package-data]
kravel = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
